<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Filter Gallery</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>

    <!-- Header -->
    <header class="page-header">
        <h1>Image Filter Gallery</h1>
        <p>Explore different CSS filters with responsive design.</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="gallery-section">

            <h2>CSS Filter Showcase</h2>

            <!-- CSS Grid Gallery -->
            <div class="gallery">

                <!-- Blur Filter -->
                <figure class="gallery-item">

                    <img
                        class="filter-blur"
                        src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                        alt="Mountain landscape"
                    >

                    <figcaption>
                        Blur Filter
                    </figcaption>

                </figure>


                <!-- Grayscale Filter -->
                <figure class="gallery-item">

                    <img
                        class="filter-grayscale"
                        src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=600&q=80"
                        alt="Forest landscape"
                    >

                    <figcaption>
                        Grayscale Filter
                    </figcaption>

                </figure>


                <!-- Sepia Filter -->
                <figure class="gallery-item">

                    <img
                        class="filter-sepia"
                        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80"
                        alt="Mountain lake"
                    >

                    <figcaption>
                        Sepia Filter
                    </figcaption>

                </figure>


                <!-- Brightness Filter -->
                <figure class="gallery-item">

                    <img
                        class="filter-brightness"
                        src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=600&q=80"
                        alt="Green plants"
                    >

                    <figcaption>
                        Brightness Filter
                    </figcaption>

                </figure>


                <!-- Contrast Filter -->
                <figure class="gallery-item">

                    <img
                        class="filter-contrast"
                        src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                        alt="Scenic mountains"
                    >

                    <figcaption>
                        Contrast Filter
                    </figcaption>

                </figure>


                <!-- Hue Rotate Filter -->
                <figure class="gallery-item">

                    <img
                        class="filter-hue"
                        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80"
                        alt="Forest trees"
                    >

                    <figcaption>
                        Hue-Rotate Filter
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="page-footer">

        <p>
            © 2026 Filter Gallery | Responsive CSS Practice
        </p>

    </footer>

</body>

</html>
